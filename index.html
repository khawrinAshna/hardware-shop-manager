if(tab==="products"){v.innerHTML='<h2>د توکو او برانډونو ثبت</h2><form id="f" class="form">'+field("name","د جنس نوم")+field("brand","برانډ / شرکت")+field("code","کوډ / بارکوډ", "text",false)+field("price","د خرڅلاو فی واحد قیمت","number")+ '<button class="primary">توکی ثبت کړئ</button></form><div class="form">'+label("د برانډ له مخې فلټر",'<select id="brandFilter">'+opts([...new Set(db.products.map(p=>p.brand))],"ټول برانډونه")+'</select>')+'</div>'+table(["جنس","برانډ","کوډ","موجودي","اوسط تمام‌شده قیمت","خرڅلاو قیمت","عملیات"],db.products.map((p,i)=>'<tr data-brand="'+esc(p.brand)+'"><td>'+esc(p.name)+'</td><td>'+esc(p.brand)+'</td><td>'+esc(p.code)+'</td><td>'+p.qty+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td><button class="danger" data-delete-product="'+p.id+'">ړنګول</button></td></tr>')) ;$("f").onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(db.products.some(p=>p.name.toLowerCase()===x.name.toLowerCase()&&p.brand.toLowerCase()===x.brand.toLowerCase()))return alert("دا جنس او برانډ مخکې ثبت دی.");db.products.push({id:uid(),name:x.name,brand:x.brand,code:x.code,qty:0,cost:0,price:+x.price});save();render()};$("brandFilter").onchange=e=>document.querySelectorAll("tr[data-brand]").forEach(r=>r.classList.toggle("hidden",!!e.target.value&&r.dataset.brand!==e.target.value));v.onclick=e=>{let id=e.target.dataset.deleteProduct;if(id&&confirm("دا توکی ړنګ شي؟")){db.products=db.products.filter(p=>p.id!==id);save();render()}}}

\s+/g,"");if(db.customers.some(c=>c.phone===phone))return alert("دا شمېره مخکې ثبت ده");let address=prompt("د مشتری بشپړ ادرس؟");if(!address)return;chosen={id:phone,name,phone,address};db.customers.push(chosen);save();search.value=name;$("selectedCustomer").value=name+" — "+phone};let cartLocal=[];function drawCart(){$("cartArea").innerHTML=table(["جنس","برانډ","مقدار","فی واحد","ټول",""],cartLocal.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.brand)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td><td><button type="button" class="danger" data-remove="'+i+'">لرې</button></td></tr>'));$("cartTotal").textContent="ټول: "+money(cartLocal.reduce((a,x)=>a+x.qty*x.price,0))} $("addCart").onclick=()=>{let id=$("saleProduct").value.split("|")[0],p=db.products.find(p=>p.id===id),qty=+$("saleForm").elements.qty.value,price=+$("saleForm").elements.price.value;if(!p||!qty||qty>p.qty)return alert("جنس او سم مقدار انتخاب کړئ؛ موجودي کافي نه ده.");cartLocal.push({productId:p.id,name:p.name,brand:p.brand,qty,price,cost:p.cost});drawCart()};$("cartArea").onclick=e=>{let i=e.target.dataset.remove;if(i!==undefined){cartLocal.splice(+i,1);drawCart()}};$("saleForm").onsubmit=e=>{e.preventDefault();if(!chosen)return alert("لومړی ثبت شوی مشتری انتخاب یا نوی مشتری ثبت کړئ.");if(!cartLocal.length)return alert("لږ تر لږه یو جنس بیل ته اضافه کړئ.");for(let x of cartLocal){let p=db.products.find(p=>p.id===x.productId);if(!p||p.qty<x.qty)return alert("د "+x.name+" موجودي کمه ده.");}let total=cartLocal.reduce((a,x)=>a+x.qty*x.price,0),paid=Math.max(0,+e.target.elements.paid.value||0);if(paid>total)return alert("ورکړل شوې پیسې له ټول مبلغ څخه زیاتې دي.");cartLocal.forEach(x=>{db.products.find(p=>p.id===x.productId).qty-=x.qty});let sale={id:uid(),invoice:String(db.nextInvoice++).padStart(5,"0"),date:today(),customerId:chosen.id,customerName:chosen.name,customerPhone:chosen.phone,mechanic:e.target.elements.mechanic.value,items:cartLocal.map(x=>({...x})),tota
