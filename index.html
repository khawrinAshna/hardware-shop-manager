<!doctype html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b32"><meta name="description" content="د ساختماني او برېښنايي توکو د دوکان مدیریت">
<link rel="manifest" href="/manifest.webmanifest">
<title>د دوکان مدیریت</title>
<style>
:root{--green:#123b32;--mint:#e7f2ed;--ink:#17231f;--muted:#66736d;--line:#dce5df;--bg:#f5f7f5;--white:#fff;--red:#a33a32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic",sans-serif}header{background:var(--green);color:white;padding:18px 4vw;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}header h1{font-size:21px;margin:0}header small{opacity:.8}.wrap{max-width:1200px;margin:auto;padding:22px 4vw}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:var(--mint);border-color:#9bb9aa}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin:18px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:25px;margin-top:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.panel h2{font-size:18px;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}.form input{min-width:0;width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:600}.table-wrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:25px}.hint{font-size:12px;color:var(--muted);margin-top:15px}.danger{color:var(--red)}@media(max-width:600px){.wrap{padding:14px}header{padding:15px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<header><div><h1 id="brand">د دوکان مدیریت</h1><small id="subtitle">د ساختماني او برېښنايي توکو سیستم</small></div><div class="toolbar"><select id="lang" aria-label="Language"><option value="ps">پښتو</option><option value="fa">دری</option><option value="en">English</option></select><span id="offline">آفلاین چمتو</span></div></header>
<main class="wrap"><div class="toolbar"><button class="primary" id="backup">د معلوماتو بیک اپ</button><button id="restore">بیک اپ بېرته راوستل</button><input id="restoreFile" type="file" accept="application/json" hidden></div>
<section class="stats"><div class="stat"><span id="sProducts">د توکو شمېر</span><strong id="countProducts">0</strong></div><div class="stat"><span id="sSales">ټول خرڅلاو</span><strong id="totalSales">0 AFN</strong></div><div class="stat"><span id="sExpenses">لګښتونه</span><strong id="totalExpenses">0 AFN</strong></div><div class="stat"><span id="sDebts">د مشتریانو پور</span><strong id="totalDebts">0 AFN</strong></div></section>
<nav class="tabs"><button class="active" data-tab="products" id="tabProducts">توکي</button><button data-tab="sales" id="tabSales">خرڅلاو</button><button data-tab="expenses" id="tabExpenses">لګښتونه</button><button data-tab="customers" id="tabCustomers">مشتریان</button></nav>
<section class="panel" id="panel"></section><p class="hint" id="notice">معلومات په همدې وسیله کې ساتل کېږي. د معلوماتو د خوندي ساتلو لپاره منظم بیک اپ واخلئ.</p></main>
<script>
const words={ps:{products:"توکي",sales:"خرڅلاو",expenses:"لګښتونه",customers:"مشتریان",add:"ثبتول",name:"نوم",price:"بیه (AFN)",qty:"مقدار",code:"کوډ / بارکوډ",date:"نېټه",amount:"مبلغ (AFN)",customer:"د مشتری نوم",note:"یادښت",empty:"تر اوسه معلومات نشته",delete:"ړنګول",sale:"خرڅلاو ثبتول",expense:"لګښت ثبتول",count:"د توکو شمېر",totalSales:"ټول خرڅلاو",totalExpenses:"لګښتونه",totalDebts:"د مشتریانو پور",backup:"د معلوماتو بیک اپ",restore:"بیک اپ بېرته راوستل",notice:"معلومات په همدې وسیله کې ساتل کېږي. د معلوماتو د خوندي ساتلو لپاره منظم بیک اپ واخلئ.",offline:"آفلاین چمتو"},fa:{products:"کالاها",sales:"فروش",expenses:"مصارف",customers:"مشتریان",add:"ثبت",name:"نام",price:"قیمت (AFN)",qty:"تعداد",code:"کد / بارکد",date:"تاریخ",amount:"مبلغ (AFN)",customer:"نام مشتری",note:"یادداشت",empty:"هنوز معلوماتی نیست",delete:"حذف",sale:"ثبت فروش",expense:"ثبت مصرف",count:"تعداد کالاها",totalSales:"مجموع فروش",totalExpenses:"مصارف",totalDebts:"قرض مشتریان",backup:"پشتیبان معلومات",restore:"بازیابی پشتیبان",notice:"معلومات در همین دستگاه ذخیره می‌شود. منظم پشتیبان بگیرید.",offline:"آفلاین آماده"},en:{products:"Products",sales:"Sales",expenses:"Expenses",customers:"Customers",add:"Save",name:"Name",price:"Price (AFN)",qty:"Quantity",code:"Code / Barcode",date:"Date",amount:"Amount (AFN)",customer:"Customer name",note:"Note",empty:"No records yet",delete:"Delete",sale:"Record sale",expense:"Record expense",count:"Products",totalSales:"Total sales",totalExpenses:"Expenses",totalDebts:"Customer debts",backup:"Export backup",restore:"Restore backup",notice:"Data is stored on this device. Export regular backups.",offline:"Offline ready"}};
let db=JSON.parse(localStorage.getItem("hardwareShopDB")||'{"products":[],"sales":[],"expenses":[],"customers":[]}');let tab="products",lang="ps";
const $=id=>document.getElementById(id),t=k=>words[lang][k]||k,save=()=>{localStorage.setItem("hardwareShopDB",JSON.stringify(db));renderStats()};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString(lang==="en"?"en-US":"fa-IR")+" AFN"}
function renderStats(){$("countProducts").textContent=db.products.length;$("totalSales").textContent=money(db.sales.reduce((a,x)=>a+Number(x.amount),0));$("totalExpenses").textContent=money(db.expenses.reduce((a,x)=>a+Number(x.amount),0));$("totalDebts").textContent=money(db.sales.reduce((a,x)=>a+Number(x.debt||0),0));}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";$("brand").textContent=lang==="ps"?"د دوکان مدیریت":lang==="fa"?"مدیریت دوکان":"Shop Manager";$("subtitle").textContent=lang==="en"?"Hardware & electrical supplies":lang==="fa"?"سیستم مدیریت مواد ساختمانی و برق":"د ساختماني او برېښنايي توکو سیستم";$("offline").textContent=t("offline");$("notice").textContent=t("notice");$("sProducts").textContent=t("count");$("sSales").textContent=t("totalSales");$("sExpenses").textContent=t("totalExpenses");$("sDebts").textContent=t("totalDebts");["products","sales","expenses","customers"].forEach(k=>{$("tab"+k[0].toUpperCase()+k.slice(1)).textContent=t(k)});document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let p=$("panel");let fields=tab==="products"?["name","price","qty","code"]:tab==="sales"?["name","qty","amount","customer","note"]:tab==="expenses"?["name","amount","note"]:["name","note"];let title=t(tab),placeholder={name:t("name"),price:t("price"),qty:t("qty"),code:t("code"),amount:t("amount"),customer:t("customer"),note:t("note")};p.innerHTML='<h2>'+title+'</h2><form class="form" id="entry">'+fields.map(f=>'<input name="'+f+'" placeholder="'+placeholder[f]+'" '+(f==="price"||f==="qty"||f==="amount"?'type="number" min="0" step="any"':'')+' required>').join("")+'<button class="primary" type="submit">'+t("add")+'</button></form><div class="table-wrap"><table><thead><tr>'+fields.map(f=>'<th>'+placeholder[f]+'</th>').join("")+'<th></th></tr></thead><tbody id="rows"></tbody></table></div>';let list=db[tab];$("rows").innerHTML=list.length?list.map((x,i)=>'<tr>'+fields.map(f=>'<td>'+esc(x[f])+'</td>').join("")+'<td><button class="danger" data-del="'+i+'">'+t("delete")+'</button></td></tr>').join(""):'<tr><td class="empty" colspan="'+(fields.length+1)+'">'+t("empty")+'</td></tr>';$("entry").onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(tab==="sales"){let product=db.products.find(a=>a.name===x.name);if(product&&Number(product.qty)>=Number(x.qty))product.qty=Number(product.qty)-Number(x.qty);else if(product){alert("Not enough stock");return}}if(tab==="customers")x.balance=0;list.unshift(x);save();render()};$("rows").onclick=e=>{let i=e.target.dataset.del;if(i!==undefined){list.splice(Number(i),1);save();render()}}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("lang").onchange=e=>{lang=e.target.value;render()};$("backup").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=u;a.download="hardware-shop-backup.json";a.click();URL.revokeObjectURL(u)};$("restore").onclick=()=>$("restoreFile").click();$("restoreFile").onchange=async e=>{try{db=JSON.parse(await e.target.files[0].text());save();render();alert("Restored")}catch{alert("Invalid backup file")}};render();renderStats();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
